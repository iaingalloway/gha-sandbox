name: Describe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  describe:
    name: Describe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Describe
        run: git describe --tags --always --dirty
